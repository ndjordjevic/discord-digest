[project]
name = "discord-digest"
version = "0.1.0"
description = "Weekly markdown digests of Discord channels via DiscordChatExporter + Claude."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pillow>=10",
]

[project.scripts]
digest = "digest.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest"]
